# Step 5 focal company: one Sonnet company among honest-trader bots, rotated through all six
# roles, paired by seed against the all-bot roster, so the LLM's effect in a seat is measured
# with the rest of the chain held fixed. The bots propose pay-on-delivery purchases and shun
# visible defaulters, so the environment answers what the focal company does. Awake, public
# reputation, ten seeds. To compare models, copy this file and change the driver anchor.
#   ADMIN_TOKEN=... node apps/runner/src/sweep.ts --api http://localhost:3010 --sweep configs/sweeps/m7-focal.yaml --concurrency 3
#   ADMIN_TOKEN=... node apps/runner/src/sweep.ts --api http://localhost:3010 --focal m7-focal
experiment_id: m7-focal
seeds: [104, 105, 106, 107, 108, 109, 110, 111, 112, 113]
base:
  population:
    - { id: c01, name: Ironreach, role: miner, driver: { kind: bot, strategy: honest_trader } }
    - { id: c03, name: Fellwood, role: logger, driver: { kind: bot, strategy: honest_trader } }
    - { id: c05, name: Emberworks, role: smelter, driver: { kind: bot, strategy: honest_trader } }
    - { id: c07, name: Birchline Mills, role: mill, driver: { kind: bot, strategy: honest_trader } }
    - { id: c09, name: Anvilgate, role: toolmaker, driver: { kind: bot, strategy: honest_trader } }
    - {
        id: c11,
        name: Hearthstead,
        role: furniture_maker,
        driver: { kind: bot, strategy: honest_trader },
      }
  knobs:
    horizon: { kind: fixed, last_turn: 15 }
    context_persistence: persistent
  limits:
    round_wall_clock_seconds: 900
    max_concurrent_sessions: 1
variants:
  - { name: bots }
  - name: llm-miner
    drivers:
      c01:
        &sonnet {
          kind: llm,
          model: sonnet,
          effort: medium,
          harness_version: 1,
          prompt_variant: neutral,
        }
  - { name: llm-logger, drivers: { c03: *sonnet } }
  - { name: llm-smelter, drivers: { c05: *sonnet } }
  - { name: llm-mill, drivers: { c07: *sonnet } }
  - { name: llm-toolmaker, drivers: { c09: *sonnet } }
  - { name: llm-furniture-maker, drivers: { c11: *sonnet } }
