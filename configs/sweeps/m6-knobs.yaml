# M6's first sweeps in one file, each paired by seed against the same baseline (the M4
# penalty-regime config): enforcement on against off, the needs board on against off, and a
# twelve-company roster with two sellers per role against the six-company one. The penalty
# variants came after the first night: 0.75 destroyed about as much cash as trade created.
#   ADMIN_TOKEN=... node apps/runner/src/sweep.ts --api http://localhost:3000 --sweep configs/sweeps/m6-knobs.yaml --concurrency 2
experiment_id: m6-knobs
seeds: [104, 105, 106]
base:
  population:
    - {
        id: c01,
        name: Ironreach,
        role: miner,
        driver:
          { kind: llm, model: sonnet, effort: medium, harness_version: 1, prompt_variant: neutral },
      }
    - {
        id: c03,
        name: Fellwood,
        role: logger,
        driver:
          { kind: llm, model: sonnet, effort: medium, harness_version: 1, prompt_variant: neutral },
      }
    - {
        id: c05,
        name: Emberworks,
        role: smelter,
        driver:
          { kind: llm, model: sonnet, effort: medium, harness_version: 1, prompt_variant: neutral },
      }
    - {
        id: c07,
        name: Birchline Mills,
        role: mill,
        driver:
          { kind: llm, model: sonnet, effort: medium, harness_version: 1, prompt_variant: neutral },
      }
    - {
        id: c09,
        name: Anvilgate,
        role: toolmaker,
        driver:
          { kind: llm, model: sonnet, effort: medium, harness_version: 1, prompt_variant: neutral },
      }
    - {
        id: c11,
        name: Hearthstead,
        role: furniture_maker,
        driver:
          { kind: llm, model: sonnet, effort: medium, harness_version: 1, prompt_variant: neutral },
      }
  knobs:
    horizon: { kind: fixed, last_turn: 15 }
  limits:
    round_wall_clock_seconds: 900
    max_concurrent_sessions: 6
variants:
  - { name: baseline }
  - { name: enforcement-off, knobs: { enforcement: "off" } }
  - { name: needs-board, knobs: { needs_board: "on" } }
  - { name: penalty-50, economy: { default_penalty_fraction: 0.5 } }
  - { name: penalty-25, economy: { default_penalty_fraction: 0.25 } }
  - name: twelve
    limits: { max_concurrent_sessions: 12 }
    population:
