# Step 4 memory sweep: the four memory cells, conversation retained or not by notes retained or
# not, with public reputation hidden and history limited to the open turn, so memory is the only
# channel for a counterparty's record. Six companies, ten seeds, paired against fresh-no-notes.
#   ADMIN_TOKEN=... node apps/runner/src/sweep.ts --api http://localhost:3010 --sweep configs/sweeps/m6-memory.yaml --concurrency 2
experiment_id: m6-memory
seeds: [104, 105, 106, 107, 108, 109, 110, 111, 112, 113]
base:
  population:
    - {
        id: c01,
        name: Ironreach,
        role: miner,
        driver:
          { kind: llm, model: sonnet, effort: medium, harness_version: 1, prompt_variant: neutral },
      }
    - {
        id: c03,
        name: Fellwood,
        role: logger,
        driver:
          { kind: llm, model: sonnet, effort: medium, harness_version: 1, prompt_variant: neutral },
      }
    - {
        id: c05,
        name: Emberworks,
        role: smelter,
        driver:
          { kind: llm, model: sonnet, effort: medium, harness_version: 1, prompt_variant: neutral },
      }
    - {
        id: c07,
        name: Birchline Mills,
        role: mill,
        driver:
          { kind: llm, model: sonnet, effort: medium, harness_version: 1, prompt_variant: neutral },
      }
    - {
        id: c09,
        name: Anvilgate,
        role: toolmaker,
        driver:
          { kind: llm, model: sonnet, effort: medium, harness_version: 1, prompt_variant: neutral },
      }
    - {
        id: c11,
        name: Hearthstead,
        role: furniture_maker,
        driver:
          { kind: llm, model: sonnet, effort: medium, harness_version: 1, prompt_variant: neutral },
      }
  knobs:
    horizon: { kind: fixed, last_turn: 15 }
    reputation_visibility: hidden
    history: current
  limits:
    round_wall_clock_seconds: 900
    max_concurrent_sessions: 6
variants:
  - { name: fresh-no-notes, knobs: { context_persistence: per_round, notes: "off" } }
  - { name: fresh-notes, knobs: { context_persistence: per_round, notes: "on" } }
  - { name: awake-no-notes, knobs: { context_persistence: persistent, notes: "off" } }
  - { name: awake-notes, knobs: { context_persistence: persistent, notes: "on" } }
